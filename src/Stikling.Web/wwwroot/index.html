<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7d4f" />
    <meta name="description" content="A free app to keep track of your plants and the cuttings you propagate from them, with photos and notes for each one. Works offline, and needs no account." />
    <title>Stikling · Free app to track your plants and cuttings</title>
    <link rel="canonical" href="https://stikling.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stikling" />
    <meta property="og:description" content="A free app to keep track of your plants and the cuttings you propagate from them, with photos and notes for each one. Works offline, and needs no account." />
    <meta property="og:url" content="https://stikling.app/" />
    <meta property="og:image" content="https://stikling.app/img/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two screens from Stikling: a pothos cutting rooting in a jar of water on day 14, and the plant it was taken from" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script defer src="lib/sentry/bundle.min.js"></script>
    <script defer src="js/errors.js"></script>
    <script>
        // Someone who has been here before gets the app from the service worker in a moment, so the
        // page below only shows the icon, and only if starting takes a while
        if (navigator.serviceWorker && navigator.serviceWorker.controller) document.documentElement.classList.add("returning");
        // Someone opening a link to keep a plant's history comes for that, not for the intro, and may
        // be starting the app for the first time, so the page says it is opening and shows the progress
        if (location.pathname.indexOf("/received/") !== -1) document.documentElement.classList.add("returning", "receiving");
    </script>
    <style>
        /* The page that shows while the app downloads, which is also what search engines and link
           previews read. It carries its own styles, so it doesn't wait for the app's. */
        @font-face {
            font-family: "Bricolage Grotesque";
            font-style: normal;
            font-weight: 200 800;
            font-stretch: 75% 100%;
            font-display: swap;
            src: url("fonts/bricolage-grotesque-latin.woff2") format("woff2");
        }

        :root {
            --intro-bg: #f6f7f4;
            --intro-surface: #ffffff;
            --intro-tint: #e6f2ea;
            --intro-border: #dde3dc;
            --intro-ink: #1d2520;
            --intro-muted: #5f6b63;
            --intro-green: #2f7d4f;
            --intro-moss: #1f5a37;
            --intro-clay: #b85c38;
            --intro-clay-soft: #f6e6dc;
            --intro-on-green: #ffffff;
            --intro-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        :root[data-bs-theme="dark"] {
            --intro-bg: #121814;
            --intro-surface: #1a221d;
            --intro-tint: #1f3327;
            --intro-border: #2c3830;
            --intro-ink: #e3e9e4;
            --intro-muted: #9aa89f;
            --intro-green: #5fb883;
            --intro-moss: #86d1a4;
            --intro-clay: #e08a64;
            --intro-clay-soft: #36241b;
            --intro-on-green: #0f1a13;
        }

        /* Without scripts nothing sets the theme, so this follows the system on its own */
        @media (prefers-color-scheme: dark) {
            :root:not([data-bs-theme]) {
                --intro-bg: #121814;
                --intro-surface: #1a221d;
                --intro-tint: #1f3327;
                --intro-border: #2c3830;
                --intro-ink: #e3e9e4;
                --intro-muted: #9aa89f;
                --intro-green: #5fb883;
                --intro-moss: #86d1a4;
                --intro-clay: #e08a64;
                --intro-clay-soft: #36241b;
                --intro-on-green: #0f1a13;
            }
        }

        /* Ahead of app.css, which has the same colours, except without scripts in a dark system theme.
           The static pages made from this one have no intro and keep app.css's */
        body:has(.intro) {
            margin: 0;
            background: var(--intro-bg);
            color: var(--intro-ink);
        }

        /* app.css hides it too, but may not have arrived yet. Blazor shows it when something fails */
        #blazor-error-ui {
            display: none;
        }

        .intro {
            box-sizing: border-box;
            max-width: 68rem;
            margin: 0 auto;
            padding: 0 1rem max(1.5rem, env(safe-area-inset-bottom));
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
        }

        .intro *,
        .intro *::before,
        .intro *::after {
            box-sizing: inherit;
        }

        .intro-hero {
            padding-top: max(1.25rem, env(safe-area-inset-top));
        }

        .intro-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--intro-display);
            font-size: 1.375rem;
            font-weight: 800;
            font-stretch: 88%;
            line-height: 1;
            letter-spacing: -0.01em;
            color: var(--intro-moss);
        }

        .intro-brand img {
            display: block;
            width: 2rem;
            height: 2rem;
        }

        .intro-main {
            display: grid;
            gap: 1.75rem;
            margin-top: 1.75rem;
        }

        .intro h1 {
            max-width: 22ch;
            margin: 0;
            font-family: var(--intro-display);
            font-size: clamp(1.75rem, 1.3rem + 2vw, 2.75rem);
            font-weight: 700;
            font-stretch: 92%;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-wrap: balance;
            color: var(--intro-ink);
        }

        .intro p {
            max-width: 34rem;
            margin: 0.75rem 0 0;
            color: var(--intro-muted);
        }

        .intro .intro-lead {
            font-size: 1.0625rem;
            color: var(--intro-ink);
        }

        .intro-loading {
            max-width: 22rem;
            margin-top: 1.5rem;
        }

        /* Blazor sets the two --blazor-load-percentage properties while it downloads */
        .intro-bar {
            height: 0.375rem;
            overflow: hidden;
            border-radius: 999px;
            background: var(--intro-tint);
        }

        .intro-bar span {
            display: block;
            width: max(0.75rem, var(--blazor-load-percentage, 0%));
            height: 100%;
            border-radius: inherit;
            background: var(--intro-green);
            transition: width 0.2s ease-out;
        }

        .intro .intro-loading-text {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-variant-numeric: tabular-nums;
            color: var(--intro-ink);
        }

        .intro-loading-text::after {
            content: " " var(--blazor-load-percentage-text, "");
        }

        .intro .intro-note {
            margin-top: 0.25rem;
            font-size: 0.875rem;
        }

        /* Two screens from the app, rising out of a tinted panel that cuts off their bottoms */
        .intro-shots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            align-items: start;
            max-height: 22rem;
            margin: 0;
            padding: 1.25rem 1rem 0;
            overflow: hidden;
            border-radius: 0.9rem;
            background: var(--intro-tint);
        }

        .intro-shots img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid var(--intro-border);
            border-radius: 0.75rem;
            background: var(--intro-surface);
        }

        .intro-shots picture + picture img {
            margin-top: 2rem;
        }

        @media (min-width: 56rem) {
            .intro {
                padding: 0 2rem 2rem;
            }

            /* Fills the screen, but leaves the next heading peeking out below to say there is more */
            .intro-hero {
                display: flex;
                flex-direction: column;
                min-height: calc(100dvh - 3.5rem);
                padding-top: 2rem;
            }

            .intro-main {
                flex: 1;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
                gap: 3rem;
                align-items: center;
                margin-top: 0;
            }

            .intro-shots {
                gap: 1.25rem;
                max-height: min(30rem, 70dvh);
                padding: 2rem 2rem 0;
            }

            .intro-shots picture + picture img {
                margin-top: 3rem;
            }
        }

        /* What the app does, below the first screen. Search engines and AI tools read it too */
        .intro-more {
            display: grid;
            gap: 3.5rem;
            padding: 3.5rem 0 0;
        }

        .intro h2 {
            margin: 0;
            font-family: var(--intro-display);
            font-size: clamp(1.375rem, 1.2rem + 0.8vw, 1.75rem);
            font-weight: 700;
            font-stretch: 92%;
            line-height: 1.15;
            letter-spacing: -0.02em;
            text-wrap: balance;
            color: var(--intro-ink);
        }

        .intro h3 {
            margin: 0;
            font-family: var(--intro-display);
            font-size: 1.0625rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--intro-ink);
        }

        .intro a {
            color: var(--intro-moss);
            text-underline-offset: 0.15em;
        }

        .intro ::selection {
            background: var(--intro-tint);
            color: var(--intro-ink);
        }

        .intro-more svg {
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* The life of one cutting, as a history in the app's own style: green while it's a cutting,
           clay once it's a plant in a pot */
        .intro-steps {
            display: grid;
            margin: 1.75rem 0 0;
            padding: 0;
            list-style: none;
        }

        .intro-step {
            position: relative;
            display: grid;
            grid-template-columns: 2.5rem minmax(0, 1fr);
            align-content: start;
            gap: 1rem;
            padding-bottom: 1.5rem;
        }

        .intro-step:last-child {
            padding-bottom: 0;
        }

        /* The line joining one step to the next */
        .intro-step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 3rem;
            bottom: 0.5rem;
            left: calc(1.25rem - 0.5px);
            width: 1px;
            background: var(--intro-border);
        }

        .intro-step-icon,
        .intro-row-icon {
            display: grid;
            place-items: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.6rem;
            background: var(--intro-tint);
            color: var(--intro-green);
        }

        .intro-step-icon svg,
        .intro-row-icon svg {
            width: 1.375rem;
            height: 1.375rem;
        }

        .intro-step.is-plant .intro-step-icon {
            background: var(--intro-clay-soft);
            color: var(--intro-clay);
        }

        .intro .intro-step-when {
            margin: 0.125rem 0 0;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
            color: var(--intro-moss);
        }

        .intro .intro-step p:last-child {
            margin-top: 0.375rem;
        }

        /* The rest of what it keeps, in rows closed up into one block like the app's Settings */
        .intro-rows {
            display: grid;
            gap: 1px;
            margin: 1.25rem 0 0;
            padding: 0;
            overflow: hidden;
            list-style: none;
            border: 1px solid var(--intro-border);
            border-radius: 0.75rem;
            background: var(--intro-border);
        }

        .intro-row {
            display: grid;
            grid-template-columns: 2.5rem minmax(0, 1fr);
            gap: 0.875rem;
            padding: 1rem;
            background: var(--intro-surface);
        }

        .intro .intro-row p {
            margin-top: 0.25rem;
            font-size: 0.875rem;
        }

        /* Questions that fold open, like the Help page */
        .intro-faq {
            margin-top: 1.25rem;
        }

        .intro-faq details {
            border: 1px solid var(--intro-border);
            border-top: 0;
            background: var(--intro-surface);
        }

        .intro-faq details:first-child {
            border-top: 1px solid var(--intro-border);
            border-radius: 0.75rem 0.75rem 0 0;
        }

        .intro-faq details:last-child {
            border-radius: 0 0 0.75rem 0.75rem;
        }

        .intro-faq summary {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-height: 2.75rem;
            padding: 0.8rem 1rem;
            font-weight: 600;
            color: var(--intro-ink);
            cursor: pointer;
            list-style: none;
        }

        .intro-faq summary::-webkit-details-marker {
            display: none;
        }

        .intro-faq summary svg {
            flex-shrink: 0;
            width: 1rem;
            height: 1rem;
            margin-left: auto;
            stroke-width: 2.25;
            color: var(--intro-muted);
            transition: transform 0.2s ease-out;
        }

        .intro-faq details[open] summary svg {
            transform: rotate(180deg);
        }

        .intro-faq summary:focus-visible,
        .intro-open:focus-visible,
        .intro-foot a:focus-visible {
            outline: 2px solid var(--intro-green);
            outline-offset: 2px;
        }

        .intro .intro-faq details p {
            margin: 0;
            padding: 0 1rem 1rem;
        }

        .intro-foot {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 1.25rem;
            margin-top: 3.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--intro-border);
            font-size: 0.875rem;
            color: var(--intro-muted);
        }

        .intro-foot a {
            display: inline-flex;
            align-items: center;
            min-height: 2.75rem;
        }

        /* The same page in the other languages, in the footer here and at the top of the static pages */
        .language-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0 1.25rem;
            margin: 0;
            font-size: 0.875rem;
            color: var(--intro-muted);
        }

        .language-links a {
            display: inline-flex;
            align-items: center;
            min-height: 2.75rem;
            color: var(--intro-moss);
        }

        .intro-foot .language-links {
            margin-left: auto;
        }

        /* On its own line on a phone, so the links stay together on the next */
        .intro-foot span {
            flex-basis: 100%;
            padding-top: 0.5rem;
        }

        /* The app has started underneath while someone reads further down. It waits for them here, within
           reach of a thumb, instead of replacing the page */
        .intro-ready {
            display: none;
        }

        .app-ready .intro-ready {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 10;
            display: block;
            padding: 0.75rem 1rem max(0.75rem, env(safe-area-inset-bottom));
            border-top: 1px solid var(--intro-border);
            background: var(--intro-surface);
            box-shadow: 0 -4px 12px rgb(0 0 0 / 0.08);
            animation: intro-ready-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intro-ready-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 64rem;
            margin: 0 auto;
        }

        .intro .intro-ready p {
            margin: 0;
            color: var(--intro-ink);
        }

        .intro-open {
            flex-shrink: 0;
            min-height: 2.75rem;
            padding: 0.5rem 1.125rem;
            border: 0;
            border-radius: 0.6rem;
            background: var(--intro-green);
            color: var(--intro-on-green);
            font-family: var(--intro-display);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .intro-open:hover {
            background: var(--intro-moss);
        }

        .app-ready .intro {
            padding-bottom: 6rem;
        }

        .app-ready .intro-loading {
            display: none;
        }

        @keyframes intro-ready-in {
            from {
                transform: translateY(100%);
            }
        }

        @media (min-width: 56rem) {
            .intro-more {
                gap: 5rem;
                padding-top: 4.5rem;
            }

            .intro-steps {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 2rem;
                margin-top: 2.25rem;
            }

            .intro-step {
                grid-template-columns: minmax(0, 1fr);
                gap: 1rem;
                padding-bottom: 0;
            }

            .intro-step:not(:last-child)::after {
                top: calc(1.25rem - 0.5px);
                right: -1.5rem;
                bottom: auto;
                left: 3.5rem;
                width: auto;
                height: 1px;
            }

            /* The heading on the left, what it introduces on the right */
            .intro-split {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
                gap: 3rem;
                align-items: start;
            }

            .intro-split > div:first-child {
                position: sticky;
                top: 2rem;
            }

            .intro-rows,
            .intro-faq {
                margin-top: 0;
            }

            .intro-rows {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .intro-foot span {
                flex-basis: auto;
                margin-right: auto;
                padding-top: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .intro-faq summary svg {
                transition: none;
            }

            .app-ready .intro-ready {
                animation: none;
            }
        }


        /* Coming back: only the icon, faded in if the app hasn't started after a moment */
        .intro-quiet {
            display: none;
        }

        .returning .intro {
            display: none;
        }

        /* On a first visit the app starts underneath the page and is shown when it opens */
        :root:not(.returning) .intro ~ #app {
            display: none;
        }

        .returning .intro-quiet {
            display: grid;
            place-items: center;
            min-height: 100dvh;
        }

        .intro-quiet img {
            width: 4.5rem;
            height: 4.5rem;
            opacity: 0;
            animation: intro-quiet-in 0.3s ease-out 0.6s forwards;
        }

        @keyframes intro-quiet-in {
            to {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .intro-quiet img {
                animation-duration: 1ms;
            }
        }

        /* Opening a link to keep a plant's history: the first download takes a while, so the icon shows
           at once with a line and the same progress bar as the intro's */
        .intro-quiet-text,
        .intro-quiet .intro-bar {
            display: none;
        }

        .receiving .intro-quiet {
            align-content: center;
            justify-items: center;
            row-gap: 0.75rem;
        }

        .receiving .intro-quiet img {
            opacity: 1;
            animation: none;
        }

        .receiving .intro-quiet-text {
            display: block;
            margin: 0;
            font-family: var(--intro-display);
            font-size: 1rem;
            color: var(--intro-ink);
        }

        .receiving .intro-quiet .intro-bar {
            display: block;
            width: min(16rem, 70vw);
        }
    </style>
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The app's styles load without holding up the page above, which only needs its own. The
         app itself takes far longer to start than they take to arrive, even from the cache. -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/app.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="Stikling.Web.styles.css" media="print" onload="this.media='all'" />
    <!-- Without scripts the swap above never happens, and the static pages made from this one need app.css -->
    <noscript>
        <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="css/app.css" />
        <style>.intro-bar, .intro-loading-text, .intro-note { display: none; }</style>
    </noscript>
    <!-- Google shows a site icon only in a multiple of 48 pixels, so it gets the 192 one -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <!-- Tells search engines the site's name and that it's a free app that runs in the browser -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebSite",
                    "name": "Stikling",
                    "url": "https://stikling.app/"
                },
                {
                    "@type": "WebApplication",
                    "name": "Stikling",
                    "url": "https://stikling.app/",
                    "description": "A free app to keep track of your plants and the cuttings you propagate from them, with photos and notes for each one. Works offline, and needs no account.",
                    "applicationCategory": "LifestyleApplication",
                    "operatingSystem": "Any",
                    "browserRequirements": "Requires JavaScript",
                    "image": "https://stikling.app/img/preview.png",
                    "isAccessibleForFree": true,
                    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
                }
            ]
        }
    </script>
</head>

<body>
    <!-- intro: the page a first visit sees while the app downloads. The deploy fills it from StaticPages/FrontPage.razor
         (tools/static-pages/render.cs and prepare-pages.py), so the page on localhost has no intro. The static pages
         made from this one have none either -->
    <!-- /intro -->

    <div id="app">
        <div class="intro-quiet"><img src="icon-192.png" alt="Stikling is starting" width="72" height="72" />
            <p class="intro-quiet-text">Opening Stikling</p>
            <div class="intro-bar" aria-hidden="true"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <!-- Blazor shows this when something fails that the app didn't catch, and wires up .reload and .dismiss -->
        <div class="error-ui-body">
            <span>Something went wrong, and Stikling needs to reload. Everything you saved is safe on this device.</span>
            <a href="." class="reload btn btn-primary btn-sm">Reload</a>
            <button type="button" class="dismiss btn btn-link btn-sm">Close</button>
        </div>
    </div>
    <script>
        // On a first visit the app starts underneath the page above and opens once it has rendered. Someone
        // who has scrolled down to read isn't pulled away mid-sentence: the app waits for them to tap Open.
        (function () {
            var intro = document.getElementById("intro");
            if (!intro || document.documentElement.classList.contains("returning")) return;
            var app = document.getElementById("app");
            var more = document.getElementById("intro-more");

            function open(focusApp) {
                intro.remove();
                document.documentElement.classList.remove("app-ready");
                window.scrollTo({ top: 0, behavior: "instant" });
                var heading = focusApp && app.querySelector("h1");
                if (heading) {
                    heading.setAttribute("tabindex", "-1");
                    heading.focus({ preventScroll: true });
                }
            }

            new MutationObserver(function (_, observer) {
                // Blazor replaces the icon with the app when it renders
                if (!app.querySelector(":scope > :not(.intro-quiet)")) return;
                observer.disconnect();
                var reading = more.getBoundingClientRect().top < window.innerHeight * 0.6;
                if (reading) document.documentElement.classList.add("app-ready");
                else open(false);
            }).observe(app, { childList: true });

            document.getElementById("intro-open").addEventListener("click", function () { open(true); });
        })();
    </script>
    <!-- The text of the page above and the bar before the app has started, for every language the live site has.

    <script type="application/json" id="shell-text">{}</script>
    <script>
        // Shows the icon's text and the error bar in the person's language: the one they chose, else the one of
        // the page they arrived on (/da/), else the first of the browser's that Stikling has. English otherwise.
        (function () {
            try {
                var text = JSON.parse(document.getElementById("shell-text").textContent);
                var chosen = window.stiklingLanguage && window.stiklingLanguage.get();
                var code = null;
                if (chosen) code = text[chosen] ? chosen : null;
                else {
                    var page = window.stiklingLanguage && window.stiklingLanguage.page();
                    if (page && text[page]) code = page;
                    else {
                        var browser = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
                        for (var i = 0; i < browser.length && !code; i++) {
                            var base = String(browser[i]).split(/[-_]/)[0].toLowerCase();
                            if (text[base]) code = base;
                        }
                    }
                }
                if (!code || code === "en") return;
                var shell = text[code];
                function set(selector, value, attribute) {
                    var element = document.querySelector(selector);
                    if (!element || !value) return;
                    if (attribute) element.setAttribute(attribute, value);
                    else element.textContent = value;
                }
                set(".intro-quiet img", shell.starting, "alt");
                set(".intro-quiet-text", shell.opening);
                set("#blazor-error-ui .error-ui-body span", shell.error);
                set("#blazor-error-ui .reload", shell.reload);
                set("#blazor-error-ui .dismiss", shell.close);
            } catch (e) { /* the text just stays English */ }
        })();
    </script>
