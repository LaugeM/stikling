# Runs the sync API, its database and the photo storage on your own machine:
#   docker compose up --build
# The API is then on http://localhost:5180. To run the API from Visual Studio or
# `dotnet run` instead, start only the database and storage with `docker compose up sql azurite`.
#
# The password is only for this local database, which is reachable from this machine alone.
# Azurite stands in for Azure Blob Storage, and its account key is the same published one everywhere.

name: stikling

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Stikling-dev-1
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - photo-data:/data

  api:
    build:
      context: .
      dockerfile: src/Stikling.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Stikling: Server=sql,1433;Database=Stikling;User Id=sa;Password=Stikling-dev-1;TrustServerCertificate=True
      ConnectionStrings__Photos: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      - "127.0.0.1:5180:8080"
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  sql-data:
  photo-data:
