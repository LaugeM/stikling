name: Feature request
description: Something you'd like the app to do.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checked
    attributes:
      label: Already on the list?
      options:
        - label: I checked the [feature list](https://github.com/LaugeM/stikling/blob/main/docs/FEATURES.md) and it isn't there.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What you'd like to do
      description: Describe what you want to do with your plants, not only the button you'd add. It helps to know how you do it today.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it yourself?
      options:
        - "No, just the idea"
        - "Yes, I'd like to make a pull request"
