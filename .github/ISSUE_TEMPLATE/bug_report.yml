name: Bug report
description: Something in the app doesn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a plant
        2. Tap History
        3. ...
  - type: input
    id: device
    attributes:
      label: Phone or computer, and browser
      placeholder: e.g. Pixel 8 with Chrome, or iPhone 15 with Safari
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Is the app installed to your home screen?
      options:
        - "Yes"
        - "No, I use it in the browser"
        - Not sure
  - type: dropdown
    id: signed-in
    attributes:
      label: Are you signed in?
      options:
        - "Yes"
        - "No"
  - type: markdown
    attributes:
      value: Please don't put your email address or other personal details here. For anything about your account or your data, email support@stikling.app.
