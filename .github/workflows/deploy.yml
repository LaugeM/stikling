name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/laugem/stikling-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Stikling.slnx --configuration Release

      - name: Publish
        run: dotnet publish src/Stikling.Web --configuration Release --output release

      # Help and Privacy as plain HTML, for search engines and AI tools that don't run the app
      - name: Render the static pages
        run: dotnet run tools/static-pages/render.cs -- release/static-pages

      # The site is on its own domain, set under Pages in the repository settings, so it's served from the root
      - name: Prepare for GitHub Pages
        run: python3 .github/scripts/prepare-pages.py release/wwwroot "/" release/static-pages

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: release/wwwroot

  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the API's container image
        run: >
          docker build --file src/Stikling.Api/Dockerfile
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --tag "$API_IMAGE:${{ github.sha }}" --tag "$API_IMAGE:main" .

      # Pull requests only check that it builds
      - name: Push it to GitHub's container registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push --all-tags "$API_IMAGE"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Needs the Azure resources, and their ids as repository secrets. See docs/ops/hosting.md.
  deploy-api:
    needs: [build, api-image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency: deploy-api
    steps:
      # Signs in as the deploy identity, which trusts this repository's main branch, so no password
      # is stored. The ids aren't passwords either, but as secrets they're hidden in the public logs.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Move the API to the new image
        run: >
          az containerapp update --resource-group rg-stikling --name stikling-api
          --image "$API_IMAGE:${{ github.sha }}" --output none

      # The new copy of the API takes a moment to start and apply its migrations
      - name: Check that it answers
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 60 https://api.stikling.app/health
